<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <!-- 首屏防闪：主题模式的同步镜像（src/theme/theme.ts 的 rememberThemeMode 写入）。
         IDB 读设置是异步的，这里在首帧前先按已存模式定主题与状态栏颜色。
         颜色与 THEME_COLORS 保持一致（无法在此内联脚本里 import CSS）。 -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('md-theme-mode')
          if (mode !== 'dark' && mode !== 'light' && mode !== 'system') return
          var light =
            mode === 'light' ||
            (mode === 'system' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: light)').matches)
          var theme = light ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = light ? '#fafafa' : '#18181b'
        } catch (e) {
          // localStorage 被禁：走默认深色
        }
      })()
    </script>
    <title>MD 镜像</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 主屏幕 App 状态栏：白字、页面延伸到栏下。浅色主题靠 styles.css
         的 --status-bar-bg 深色带保证白字可读。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MD镜像" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
